# ---------------------------------------------------------------------------
# Release-notes categorisation for GitHub's auto-generated notes.
#
# ⚠️ THIS FILE IS NOT WHAT PRODUCES THE RELEASE NOTES ANY MORE.
# The release pipeline generates `RELEASE_NOTES.md` with
# `scripts/changelog.mjs`, which reads the COMMIT LOG. This repository commits
# directly to `main` (no PR per change), so GitHub's generator -- which
# categorises by PULL-REQUEST LABEL and can only list PRs -- would emit an
# essentially empty changelog. See docs/design/ci.md section 5.
#
# This file is kept deliberately:
#   * it is what the GitHub UI's "Generate release notes" button uses when a
#     maintainer drafts a release by hand;
#   * it stays correct for the moment changes start arriving through PRs.
# Keep the label names below mirroring the Conventional Commit types (see
# CONTRIBUTING.md). No labeler automation is configured: a maintainer applies
# them, or Dependabot sets `dependencies` automatically.
#
# Schema reference: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
# ---------------------------------------------------------------------------
changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: '⚠️ 破坏性变更'
      labels:
        - breaking
    - title: '🚀 新功能'
      labels:
        - feat
        - enhancement
    - title: '🐛 缺陷修复'
      labels:
        - fix
        - bug
    - title: '⚡ 性能优化'
      labels:
        - perf
    - title: '♻️ 重构'
      labels:
        - refactor
    - title: '📦 构建与依赖'
      labels:
        - build
        - dependencies
    - title: '🔧 CI 与工程化'
      labels:
        - ci
    - title: '🧪 测试'
      labels:
        - test
    - title: '📝 文档'
      labels:
        - docs
        - documentation
    - title: '其他变更'
      labels:
        - '*'
