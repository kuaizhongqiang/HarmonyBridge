# ---------------------------------------------------------------------------
# HarmonyBridge CI -- the gate every branch push and PR must pass.
#
# Design rule for this repository: a workflow must never pretend to have
# produced something it did not. There is no HarmonyOS SDK, no signing material
# and no device on GitHub-hosted runners, so a signed HAP cannot be built here.
# What CAN run on a hosted runner is everything that has nothing to do with the
# HarmonyOS toolchain.
#
# The SDK-free gates (repo hygiene, manifests, Go build/vet/test) live in
# `.github/workflows/verify.yml` -- a REUSABLE workflow -- because the release
# pipeline must apply exactly the same rules to a tag that CI applies to a
# branch. One definition, two callers; they cannot drift.
#
# Jobs defined here:
#   verify            -> calls verify.yml (hygiene + manifests + go)
#   conventional-pr   -> PR title must follow Conventional Commits (PR only)
#   build-hap         -> DISABLED (`if: false`). Needs a self-hosted runner with
#                        DevEco Studio + the SDK; see the comment on that job,
#                        docs/design/ci.md section 4, and release.yml (which is
#                        where the real HAP build lives now).
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  # Manual trigger. Useful to re-run the cheap gates on demand, and it is the
  # dispatch entry point for the build-hap job below.
  # NOTE: GitHub does not support job-level `workflow_dispatch`; dispatching
  # runs every job in this file, and build-hap stays guarded by `if: false`.
  workflow_dispatch:
    inputs:
      verify_bootstrap:
        description: '额外跑 install-hooks + bootstrap（慢，验证新克隆上手路径）'
        type: boolean
        default: false

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # The shared SDK-free gates. See verify.yml for what each one does and, just
  # as importantly, for what it does NOT cover.
  # -------------------------------------------------------------------------
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml
    with:
      repo_hygiene: true
      # A plain push should not pay for a fresh-clone test; ask for it.
      verify_bootstrap: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_bootstrap || false }}

  # -------------------------------------------------------------------------
  # PR title must be a Conventional Commit. This is the same rule the
  # commit-msg hook enforces locally, applied where nobody can bypass it.
  #
  # Triggered by `pull_request` (not `pull_request_target`): the action only
  # reads the PR title, so it needs no token beyond the default, and running it
  # on the base-commit context means no fork code is ever checked out or
  # executed. `pull-requests: read` is enough; the action writes no comments.
  # -------------------------------------------------------------------------
  conventional-pr:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate the PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # A bare "feat: " with nothing after the colon is not a message.
          subjectPattern: '.+'
          subjectPatternError: |
            PR 标题在 ":" 之后必须有描述，例如 "feat(vpn): 支持 TUN 回退"。
          # Catches the common squash-merge mistake of committing a single
          # commit's own (possibly non-conventional) message.
          validateSingleCommit: true

  # -------------------------------------------------------------------------
  # DISABLED BY DEFAULT (`if: false`), because it cannot succeed as written.
  #
  # Producing a HAP needs all of:
  #   * DevEco Studio 26.0 (or a compatible install) containing
  #     tools/hvigor/bin/hvigorw and tools/ohpm/bin/ohpm
  #   * the HarmonyOS SDK (build-profile.json5 asks for API 24 compatibility,
  #     26.0.0 target) -- several GB, licence-gated download
  #   * for the ohosTest suite only: a connected device or emulator
  #   (Signing material is NOT needed any more: release.yml publishes an
  #    unsigned HAP on purpose -- see docs/design/ci.md section 5.)
  #
  # None of that exists on GitHub-hosted runners. `if: false` therefore skips
  # the job entirely. The moment the guard is removed, this job targets a
  # self-hosted runner label that does not exist by default, so it waits for a
  # runner instead of silently succeeding -- and its first step is a hard
  # `exit 1` with an actionable message.
  #
  # NOTE: the *release* path is no longer a scaffold. `.github/workflows/
  # release.yml` builds the HAP on a self-hosted runner. This CI job stays
  # disabled because per-push HAP builds belong on the release path, not on
  # every branch push; see docs/design/ci.md section 3.4.
  # -------------------------------------------------------------------------
  build-hap:
    name: build HAP (self-hosted, manual)
    if: false
    runs-on: [self-hosted, harmonyos, windows]
    timeout-minutes: 60
    steps:
      - name: Report that this job is not provisioned yet
        shell: powershell
        run: |
          Write-Host '::error::build-hap is intentionally disabled.'
          Write-Host 'A self-hosted runner with DevEco Studio + SDK is required.'
          Write-Host 'For a release build use .github/workflows/release.yml.'
          Write-Host 'See docs/design/ci.md -> "自托管 HarmonyOS runner".'
          exit 1
