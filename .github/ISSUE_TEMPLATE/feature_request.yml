name: 功能建议
description: 提出一个新功能、改进或增强建议
title: '[Feature] '
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与 Discussions，没有重复建议
          required: true
        - label: 我已确认这不是「与上游 v2rayN 行为不一致」的纯移植问题（若是，请在下方注明）
          required: false

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的困难或现状的不足，而不是直接给方案
      placeholder: 例如：切换节点时必须手动断开再重连，无法保持会话
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他可能的做法，以及为什么不选它们
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      description: 主要影响哪一部分
      multiple: true
      options:
        - ArkTS 界面（entry/src/main/ets）
        - 原生核心（entry/src/main/golang, entry/src/main/cpp）
        - VPN 能力（VpnExtensionAbility）
        - 构建 / 打包 / 依赖
        - 文档
        - CI / 工程化
        - 其他（在下方说明）
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: 与上游 v2rayN 的关系
      description: |
        本项目的界面与交互以 https://github.com/2dust/v2rayN 为参照。
        若该建议对应上游已有功能，请给出上游的界面/文件线索，便于对照。
        **注意**：只能作为行为参考，不能把 GPL-3.0 的代码复制进来。
      placeholder: 例如：上游「参数设置 → 核心：基础设置」页有同名开关
    validations:
      required: false

  - type: textarea
    id: licensing
    attributes:
      label: 许可证影响
      description: |
        若该建议需要引入新的第三方依赖或代码，请注明其许可证
        （当前项目为 MIT；Xray-core 为 MPL-2.0，sing-box 为 GPL-3.0，
        third_party/v2rayN 为 GPL-3.0，三者混用前必须先做许可证决策）。
        不需要新依赖时写「无」。
      placeholder: 无
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、草图、截图等
    validations:
      required: false
